org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true

# `shared` combines com.android.library with org.jetbrains.kotlin.multiplatform,
# which AGP 9.0+ refuses outright (it requires com.android.kotlin.multiplatform.library
# instead - see https://developer.android.com/kotlin/multiplatform/plugin). That plugin's
# DSL is still changing shape across AGP 9.x releases, so these two flags fall back to
# AGP's pre-9.0 Kotlin handling to keep the proven classic setup working for now.
# This is a temporary bypass, not a long-term fix — migrate `shared` to
# com.android.kotlin.multiplatform.library before AGP 10 (H2 2026) removes it.
android.builtInKotlin=false
android.newDsl=false
